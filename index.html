<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>js-synth</title>
  <style>
    #settingsPanel { margin-bottom: 8px; font-family: Arial, sans-serif; font-size: 13px; }
    #settingsPanel .settingGroups { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    #settingsPanel fieldset { display: flex; flex-direction: column; gap: 4px; margin: 0; }
    #settingsPanel fieldset label { display: flex; justify-content: space-between; gap: 8px; }
    #settingsPanel input[type="number"] { width: 70px; }
  </style>
</head>
<body>

  <div id="settingsPanel"></div>  <!-- filled in by settingsPanel.js -->


  <canvas
    id="myCanvas"
    width="1300"
    height="700"
    style="border:1px solid #000000;">
  </canvas>

<!-- Classic (non-module) scripts sharing one global scope; order matters. -->

<script src="keyboardLayout.js"></script>

<!-- Tuning math and scales (used by both sound and drawing) -->
<script src="music/musicUtils.js"></script>
<script src="music/scales.js"></script>

<!-- Sound -->
<script src="audio/audioUtils.js"></script>
<script src="audio/instruments.js"></script>
<script src="audio/key.js"></script>
<script src="audio/synth.js"></script>

<!-- Drawing -->
<script src="drawing/coordinates.js"></script>
<script src="drawing/drawingUtils.js"></script>
<script src="drawing/keyDrawer.js"></script>
<script src="drawing/tonnetz.js"></script>
<script src="drawing/lattice.js"></script>

<!-- Page UI -->
<script src="settingsPanel.js"></script>

<!-- Entry point: configuration and wiring -->
<script src="script.js"></script>

</body>
</html>
